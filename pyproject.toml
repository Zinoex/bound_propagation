[project]
name = "bound_propagation"
version = "0.5.0"
description = "Bound propagation in Pytorch"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    { name = "Frederik Baymler Mathiesen", email = "frederik@baymler.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/zinoex/bound_propagation"
"Bug Tracker" = "https://github.com/zinoex/bound_propagation/issues"

[dependency-groups]
dev = [
    "sphinx==1.8.2",
    "sphinx-gallery==0.3.1",
    "docutils==0.16",
    "sphinx-copybutton",
    "sphinxcontrib-katex",
    "tqdm",
    "matplotlib",
    "seaborn",
    "torchvision",
    "PyHamcrest",
    "pytorch-sphinx-theme @ git+https://github.com/pytorch/pytorch_sphinx_theme.git",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 180

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
